services:
    bronto-burgers:
        image: bronto-app
        build:
            context: .
            args:
                INSTALL_XDEBUG: "true"
        container_name: bronto-burgers
        ports:
            - "8087:80"
        volumes:
            - ./:/var/www/html
        networks:
            - bronto-burgers-network
    bronto-burgers-node:
        image: bronto-app
        container_name: bronto-burgers-node
        working_dir: /var/www/html
        ports:
            - "5174:5173"
        volumes:
            - ./:/var/www/html
            - bronto-burgers-node-modules:/var/www/html/node_modules
        command: sh -c "mkdir -p /var/www/.npm && chown -R www-data:www-data /var/www/.npm /var/www/html/node_modules && su www-data -s /bin/sh -c 'npm ci && npm run dev -- --host 0.0.0.0'"
        environment:
            CHOKIDAR_USEPOLLING: "true"
            NPM_CONFIG_CACHE: /var/www/.npm
        depends_on:
            - bronto-burgers
        networks:
            - bronto-burgers-network
volumes:
    bronto-burgers-node-modules:
networks:
    bronto-burgers-network:
        external: true
